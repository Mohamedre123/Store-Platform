name: تطبيق أندرويد

# بيبني APK (للتجربة والتوزيع المباشر) وAAB (لجوجل بلاي) مع كل تغيير في
# مجلد التطبيق، ويرفعهم كـArtifacts تتنزّل من صفحة التشغيل.
#
# التوقيع اختياري: من غير الأسرار دي النسخة بتتبني من غير توقيع (تنفع
# للتجربة بس). أضفهم من Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64   ملف المفتاح بصيغة base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: تسطيب
        run: npm ci

      - name: بناء طبقة التطبيق ومزامنة المشروع
        run: npm run sync

      - name: مفتاح التوقيع
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/release.keystore
          echo "ZAWYA_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"

      - name: بناء APK وAAB
        working-directory: mobile/android
        env:
          ZAWYA_VERSION_CODE: ${{ github.run_number }}
          ZAWYA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZAWYA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZAWYA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zawya-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
